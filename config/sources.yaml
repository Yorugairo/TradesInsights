  # ── Statewide (P0) ────────────────────────────────────────────────────────
  - key: wa_sepa
    name: Washington Ecology SEPA Register
    authority: WA Department of Ecology
    priority: P0
    landing_url: https://ecology.wa.gov/regulations-permits/sepa/environmental-review/sepa-register
    access_url: https://data.wa.gov/resource/mmcb-z6jf.json
    format: socrata_json
    access_class: socrata
    cadence: daily
    county: null
    permitting_jurisdiction: null
    enabled: true
    terms_reviewed_at: "2026-07-15"
    robots_reviewed_at: "2026-07-15"
    # D4 — substitute coverage: wa_sepa carries the SEPA/environmental
    # determinations for these access-blocked direct sources, so if wa_sepa
    # goes red their fallback is gone too (the alert escalates accordingly).
    mitigates:
      - pierce_environmental_determinations
      - tumwater_development_review
      - tumwater_sepa
    notes: >-
      Verified 2026-07-15: consumed from the official data.wa.gov Socrata
      dataset mmcb-z6jf (provenance "official", attribution WA Ecology) —
      the separ search UI is robots-disallowed for query URLs (/separ/*?*)
      and is only cited per record, never fetched. Query bounded to the four
      pilot counties on leadagencyissuedate with a 14-day overlap. Dedupe
      against local sources happens in M2 resolution.

