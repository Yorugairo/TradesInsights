# Source manifest — spec §6. Every live source ships disabled and is enabled
# only after the §5 activation checklist passes (verify landing page, record
# format/cadence, review robots+terms, fixtures, parser, manual audit, shadow
# mode). terms_reviewed_at and robots_reviewed_at are required to enable.
sources:
  # ── Harness (M0) ──────────────────────────────────────────────────────────
  - key: fake_source
    name: Fake fixture source (M0 harness)
    authority: test
    priority: test
    landing_url: https://example.invalid/fake-source
    access_url: null
    format: json
    access_class: fixture
    cadence: on_demand
    county: Thurston
    permitting_jurisdiction: Test Jurisdiction
    enabled: true
    terms_reviewed_at: "2026-07-15"
    robots_reviewed_at: "2026-07-15"
    notes: Fixture-backed adapter proving the M0 exit gate. Never fetches network.

  # ── Thurston County (P0) ──────────────────────────────────────────────────
  - key: lacey_projects_rest
    name: Lacey Projects REST
    authority: City of Lacey
    priority: P0
    landing_url: https://cityoflacey.org/current-projects/
    access_url: https://cityoflacey.org/wp-json/wp/v2/projects?per_page=100&orderby=modified&order=desc&_fields=id,date,modified,link,title
    format: json
    access_class: api_json
    cadence: daily
    county: Thurston
    permitting_jurisdiction: City of Lacey
    enabled: true
    terms_reviewed_at: "2026-07-15"
    robots_reviewed_at: "2026-07-15"
    notes: >-
      Verified 2026-07-15: live WP REST collection, 79 projects, X-WP-TotalPages
      pagination. robots.txt is empty (no restrictions). Public city data, no
      terms restricting automated access found on cityoflacey.org.

  - key: customer_bid_inbox_solis
    name: Solis Interiors Bid Inbox (customer-authorized export)
    authority: Customer-authorized (Solis Interiors)
    priority: P1
    landing_url: https://private.invalid/customer_bid_inbox_solis
    format: json_export
    access_class: private_authorized
    cadence: on_demand
    county: null
    permitting_jurisdiction: null
    enabled: false
    account_key: solis_interiors
    notes: >-
      M4.6 scaffolding (2026-07-16). Reads customer-provided JSON exports from
      a local inbox directory (CUSTOMER_BID_INBOX_DIR) — never scraped, never
      fetched with customer credentials (prohibited). ALL data is private to
      solis_interiors (sources.account_profile_id); reads are access-audited
      (artifact_access_log). The ONLY source class allowed to set
      bidding_confirmed, and only for explicit invitation/solicitation
      statuses. BLOCKED until Solis grants written authorization and provides
      the export path/platform (spec 22 calibration item); fixture-tested.

  - key: lacey_permit_reports
    name: Lacey Monthly Census Reports (New Construction)
    authority: City of Lacey Community & Economic Development
    priority: P1
    landing_url: https://cityoflacey.org/permit%20reports/
    format: pdf_index
    access_class: pdf_index
    cadence: monthly
    county: Thurston
    permitting_jurisdiction: City of Lacey
    enabled: true
    terms_reviewed_at: "2026-07-16"
    robots_reviewed_at: "2026-07-16"
    # D2: verified always-present in the census parser output (addressRaw, the
    # census issue date, and the valuation the report is fundamentally about).
    required_fields: [addressRaw, issueDate, valuationUsd]
    notes: >-
      Verified 2026-07-16 (M4.5, measured coverage gap: zero Lacey
      permit-stage records). Permit Reports page lists monthly "Census Report
      (New Construction)" PDFs back to 2015 with permit-level rows (permit
      no, subtype, address, issue date, dwelling units) plus a per-row
      valuation page paired by order (count mismatch => valuations stay
      null). Companion "Construction Activity" PDFs carry category COUNTS
      only, not records — deliberately skipped. Some filenames omit the year
      (April 2026) — report month falls back to the upload-path year.
      cityoflacey.org robots.txt: no disallow (April review re-confirmed).

