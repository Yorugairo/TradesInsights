# Source manifest — spec §6. Every live source ships disabled and is enabled
# only after the §5 activation checklist passes (verify landing page, record
# format/cadence, review robots+terms, fixtures, parser, manual audit, shadow
# mode). terms_reviewed_at and robots_reviewed_at are required to enable.
