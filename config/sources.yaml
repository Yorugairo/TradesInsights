    name: Fake fixture source (M0 harness)
    authority: test
    priority: test
    landing_url: https://example.invalid/fake-source
    access_url: null
    format: json
    access_class: fixture
    cadence: on_demand
    county: Thurston
    permitting_jurisdiction: Test Jurisdiction
    enabled: true
    terms_reviewed_at: "2026-07-15"
    robots_reviewed_at: "2026-07-15"
    notes: Fixture-backed adapter proving the M0 exit gate. Never fetches network.

  - key: fake_source_required
