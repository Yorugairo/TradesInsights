      ⇒ schedulableSources NEVER schedules it in the datacenter (where
      ci.tumwater.wa.us's Akamai edge policy 403s automated/datacenter clients —
      no bot bypass). Akamai fingerprints the automated CLIENT (not just egress IP),
      so the adapter's fetch() 403s even in-region — the operator-local run therefore
      parses an in-region GENUINE-BROWSER capture staged into
