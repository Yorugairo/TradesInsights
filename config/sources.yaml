  # ── Lewis County (P0) ─────────────────────────────────────────────────────
  - key: lewis_issued_permits
    name: Lewis Building Permit Data
    authority: Lewis County Community Development
    priority: P0
    landing_url: https://lewiscountywa.gov/departments/community-development/building-permit-data/
    format: pdf_index
    access_class: pdf_index
    cadence: weekly
    county: Lewis
    permitting_jurisdiction: Lewis County
    enabled: true
    terms_reviewed_at: "2026-07-15"
    robots_reviewed_at: "2026-07-15"
    notes: >-
      Verified 2026-07-15: index page lists dated weekly "Issued Permits with
      Valuation" PDFs (MM.DD.YYYY prefix, one glitched CMS name tolerated);
      /documents/ URLs 302-redirect to /media/documents/. Rotated-table PDF
      parsed via positioned text. Golden fixture 2026-06-28 (wrapped rows,
      applicant vs primary-contractor). robots.txt disallows only
      /media/oldSite/. Reports' printed grand total can exceed the sum of
      printed per-row valuations (source-side; we never fabricate).

  - key: lewis_inspections
    name: Lewis Daily Scheduled Building Inspections
    authority: Lewis County Community Development
    priority: P1
    landing_url: https://lewiscountywa.gov/departments/community-development/building-inspections/daily-building-inspections/
    format: pdf_daily
    access_class: pdf_index
    cadence: daily
    county: Lewis
    permitting_jurisdiction: Lewis County
    enabled: true
    terms_reviewed_at: "2026-07-16"
    robots_reviewed_at: "2026-07-16"
    # D2: an inspection record always carries a site address; valuation/units are
    # structurally absent (an inspection is not a permit) so they are NOT required.
    required_fields: [addressRaw]
    notes: >-
      Verified 2026-07-16 (M4.5). Page links the current day's
      "MM.DD.YYYY_Scheduled_Inspections_-_Permitting.pdf" (302 to
      /media/documents/). Late-stage trade-timing signal: FINAL INSPECTION on
      a residence => near_final (spec 12.1 shower/mirror window). Only the
      current day is published — no archive, so no backfill; strict daily
      freshness per spec. Rows anchor on permit number; inspections merge
      into existing permit projects via rawFields.permitNumbers (explicit
      reference pass).

