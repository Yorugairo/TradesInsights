    required_fields: [addressRaw, issueDate, valuationUsd]
    terms_reviewed_at: "2026-07-15"
    robots_reviewed_at: "2026-07-15"
    notes: >-
      Test-only sibling of fake_source that DECLARES required_fields, so the D2
      absolute-floor health tests exercise a source with requirements without
      touching a real source's run history. Never enabled, never fetched.

