  - key: tumwater_development_review
    name: Tumwater Development Review
    authority: City of Tumwater
    priority: P0
    landing_url: https://www.ci.tumwater.wa.us/departments/community-development-department/permitting-building/development-review
    access_url: https://www.ci.tumwater.wa.us/departments/community-development-department/permitting-building/development-review
    format: html_docs
    access_class: html
    cadence: on_demand
    county: Thurston
    permitting_jurisdiction: City of Tumwater
    enabled: true
    terms_reviewed_at: "2026-07-19"
    robots_reviewed_at: "2026-07-19"
    notes: >-
      Development Review Committee (DRC) weekly meeting agendas (Date / Meeting
      Type / Agenda table). Adapter: TumwaterDevelopmentReviewAdapter (key
      tumwater_development_review). Genuine-visitor capture-fed; ENABLED for
      OPERATOR-LOCAL runs (2026-07-20). cadence on_demand ⇒ schedulableSources
      NEVER schedules it in the datacenter (where ci.tumwater.wa.us's Akamai edge
      policy 403s automated/datacenter clients — no bot bypass, fetch() dead-letters).
      Akamai fingerprints the automated CLIENT (not just egress IP), so the
      adapter's fetch() 403s even in-region — the operator-local run therefore
      parses an in-region GENUINE-BROWSER capture of the index staged into
      $OTN_CAPTURE_DIR/tumwater_development_review/drc-agendas.index.json. Cron
      `OTN_CAPTURE_DIR=<dir> pnpm source:run:operator-local` on the operator's
      machine after the daily capture; never a bot/WAF bypass.
      One record per meeting (date + agenda PDF link). The index carries NO party
      data (applicant/project names live inside the agenda PDFs, which we do not
      fetch — keeps homeowner PII out of the registry bridge), so organizations[]
      is empty and normalizedStage stays unknown. Parser reconciles record count
      against the dated agenda rows.

