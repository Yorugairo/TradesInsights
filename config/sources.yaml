    county: Thurston
    permitting_jurisdiction: City of Lacey
    enabled: true
    terms_reviewed_at: "2026-07-15"
    robots_reviewed_at: "2026-07-15"
    notes: >-
      Verified 2026-07-15: project detail pages discovered from the documented
      WP REST collection (modified high-water + 1-day overlap), fetched at
