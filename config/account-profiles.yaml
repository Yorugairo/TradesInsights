        version: 1
        effective_at: "2026-07-15"
        provisional: true
        rule:
          best_signals:
            - subdivisions
            - approved_phases
            - clustered_sfr_townhome_permits
            - low_rise_multifamily_joint_review
            - late_stage_shower_mirror
          joint_review_with: lacey_glass_commercial
