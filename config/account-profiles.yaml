# Rules marked provisional await pilot calibration answers (spec §22).
accounts:
  - key: lacey_glass_at_home
    name: Lacey Glass at Home
    active: true
    organization:
      legal_name: Lacey Glass at Home
      ubi: null
      contractor_registration: null
      excluded_ubis: []
      website: https://laceyglassathome.com/
    capabilities:
      - windows
      - doors
      - showers
      - mirrors_glass
      - skylights
      - sunrooms
    territory:
      counties_included: [Thurston, Lewis, Mason, Pierce, Grays Harbor]
      counties_excluded: [King]
