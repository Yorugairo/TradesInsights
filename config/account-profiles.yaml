  - key: solis_interiors
    name: Solis Interiors
    active: true
    organization:
      legal_name: Solis Interiors LLC
      ubi: "604837560"
      contractor_registration: SOLISIL785NT
      excluded_ubis: ["604701295"]
      website: null
    capabilities:
      - drywall
      - painting
    territory:
      counties_included: [Thurston, Pierce, Lewis, King]
      counties_excluded: []
      # Owner-set from relationship knowledge, not stated by Solis — see
      # `owner_assumed` below. Geographic WEIGHTING within these counties is live
      # in scorer v1.9.0 (home metro up, King commercial down); the county LIST
      # itself has never been confirmed by Solis.
      notes: Territory owner-assumed; awaiting Solis confirmation (spec §22).
    # Spec §12.3 — do NOT finalize weights until Solis confirms scope, territory,
    # capacity, minimum job size, preferred GCs, and public-work eligibility.
    # These equal-weight placeholders are provisional.
    score_components:
      - { component: trade_fit, weight: 30 }
      - { component: package_size_fit, weight: 25 }
      - { component: timing, weight: 20 }
      - { component: geography, weight: 15 }
      - { component: evidence_quality, weight: 10 }
    delivery:
      priority_review_min: 80
      weekly_digest_min: 65
      # PROVISIONAL until the 2026-07 calibration session (P2.1): home point =
      # Lacey WA; interior packages priced 0-60d post-issuance.
      # Owner 2026-07-20 — layered easy-win proximity bands (nearest-first):
      # <=20 / <=35 / <=50 miles from the Lacey home point; the outer 50-mile
      # band supersedes the flat radius (radius_km 80.5 km = 50 mi, so the flat
      # fallback equals the outer band). NO minimum job size by default — Solis
      # takes small jobs too; a floor is added only if Solis asks for one at
      # calibration. Upper cap kept as a sanity ceiling (mega-projects are a
      # different sales motion).
      easy_win:
        home_lon: -122.823
        home_lat: 47.046
        radius_km: 80.5
        radius_bands_mi: [20, 35, 50]
        max_age_days: 60
        min_valuation_usd: null
        max_valuation_usd: 2000000
    rules:
      - rule_type: routing
        version: 1
        effective_at: "2026-07-15"
        provisional: true
        rule:
          favor:
            - tenant_improvements
            - moderate_drywall_painting_packages
            - phased_work
          gc_relationship_radar_when: package_size_likely_exceeds_capacity
      - rule_type: exclusion
        version: 1
        effective_at: "2026-07-15"
        provisional: false
        rule:
          excluded_ubis: ["604701295"]
          reason: older closed legal entity — never attribute records to it
    # Set by the OWNER from relationship knowledge of Solis, not stated by Solis.
    # These are LIVE in scoring today and carry no customer mandate — the
    # 2026-07-26 session is a confirm-or-correct pass over this list, NOT a
    # blank-slate interview. An item moves to a rule (or is reversed) only when
    # Solis speaks to it. See docs/calibration-prep-solis.md §0.
    owner_assumed:
      - territory counties Thurston/Pierce/Lewis/King — never stated by Solis
      - geographic weighting — home metro up, King commercial down, Pierce ~equal (scorer v1.9.0)
      - application-stage ranked ABOVE issued (scorer v1.9.0)
      - warm_gc_active carries a small positive weight (scorer v1.9.0)
      - easy-win proximity bands 20/35/50 mi from the Lacey home point
      - no minimum job size (no valuation floor); $2M upper sanity cap
      - King jobs under $10k are digest-band not priority (scorer v1.6.0)
    # Genuinely unknown — nobody has answered these.
    calibration_pending:
      - current entity/license and renewal (registration runs through 2026-08-11)
      - detailed drywall and painting scope
      - crew/subcontract capacity
      - preferred/blocked GCs
      - public-work/bonding/union/prevailing-wage constraints
      - current invitation platforms and authorized ingestion method
      - priority threshold 80 — 13 changed/wk; confirm that weekly volume is right
      - easy-win last-change age window (<=30 d vs <=60 d)
