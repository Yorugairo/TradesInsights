services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: otn
      POSTGRES_PASSWORD: otn
      POSTGRES_DB: otn
    ports:
      # Host port is overridable (PG_PORT in .env) for machines where a native
      # PostgreSQL already owns 5432 — Windows lets both listeners bind, and the
      # native one then intercepts host connections (auth failures against the
      # container's credentials). Set PG_PORT=5433 in .env in that case and use
      # the same port in DATABASE_URL.
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otn -d otn"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: otn-minio
      MINIO_ROOT_PASSWORD: otn-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
